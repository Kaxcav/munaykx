services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: munay
      POSTGRES_PASSWORD: munay
      POSTGRES_DB: munay
    # 5434 no host: 5432/5433 já são usadas por Postgres de outros projetos.
    ports: ["5434:5432"]
    volumes:
      - munay_pgdata:/var/lib/postgresql/data
  # Caixa de entrada falsa pra dev e CI (STORY-007). SMTP em 1025, UI em 8025.
  # Nada sai daqui pra internet — é onde o magic link cai enquanto o domínio
  # próprio não existe. (MailHog está sem manutenção desde 2020.)
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
volumes:
  munay_pgdata:
